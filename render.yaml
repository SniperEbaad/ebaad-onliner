services:
  - type: web
    name: discord-onliner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: discord-onliner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: discord-onliner-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: ADMIN_DISCORD_ID
        value: 1524547752741310578
      - key: DISCORD_CLIENT_ID
        value: 1541545028848066630
      - key: DISCORD_CLIENT_SECRET
        value: DbOMkG5KYPB3DQk0JQbkjaevxw1CmHJj
      - key: DISCORD_BOT_TOKEN
        value: MTU0MTU0NTAyODg0ODA2NjYzMA.GAe0WF.d7BYiYBgMilQic2E3zCTT3UQlCb0jGntVN2oi4

  - type: redis
    name: discord-onliner-redis
    plan: free

databases:
  - name: discord-onliner-db
    plan: free

services:
  - type: web
    name: discord-onliner-fkua
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npx prisma db push && node server.js
    # NO envVars section at all — everything is in Render Dashboard

  - type: redis
    name: discord-onliner-redis
    plan: free
    ipAllowList: []

databases:
  - name: discord-onliner-db
    plan: free
